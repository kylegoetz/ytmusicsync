name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows .exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: |
          pytest -v tests/

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --onefile --collect-all ytmusicapi main.py -n ytmusicsync.exe

      - name: Upload Windows executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytmusicsync-windows-x64
          path: dist/ytmusicsync.exe
          if-no-files-found: error

